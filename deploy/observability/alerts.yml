groups:
  - name: timeline-symptoms
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Доля 5xx > 1% за 5 минут"

      - alert: BoardLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~".*/timeline/board"}[5m]))
          ) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p99 доски > 1 с"

      - alert: DltNotEmpty
        expr: increase(kafka_dlt_messages_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "В DLT появилось сообщение"

      - alert: OutboxStuck
        expr: outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Запись в outbox не опубликована > 60 с"

      - alert: SagaStuck
        expr: saga_stuck > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Сага в STARTED дольше 5 минут"

      - alert: BoardProjectionLag
        expr: board_projection_lag_seconds > 30
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Лаг read-model доски > 30 с"
