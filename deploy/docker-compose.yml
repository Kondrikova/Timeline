name: timeline

services:

  # Физически один инстанс, логически — своя база и свой пользователь на сервис.
  # Кросс-сервисные запросы невозможны на уровне прав, поэтому принцип
  # database-per-service соблюдён при разумном потреблении ресурсов.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: timeline-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # KC_HOSTNAME фиксирует издателя токена. Без него значение claim iss зависело бы
  # от того, по какому адресу пришёл запрос, и проверка в сервисах стала бы
  # плавающей.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8090"
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8090"
    volumes:
      - ./keycloak/realm-timeline.json:/opt/keycloak/data/import/realm-timeline.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && echo -e 'GET /realms/timeline HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30

  team-service: &app-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: team-service
    environment: &app-env
      KAFKA_BOOTSTRAP: kafka:19092
      # Издатель токена виден снаружи, ключи забираются изнутри сети.
      OIDC_ISSUER: http://localhost:8090/realms/timeline
      OIDC_JWKS: http://keycloak:8090/realms/timeline/protocol/openid-connect/certs
      PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/team
      DB_USER: team
      DB_PASSWORD: team
    ports:
      - "8082:8082"
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  backlog-service:
    <<: *app-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: backlog-service
    environment:
      <<: *app-env
      PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/backlog
      DB_USER: backlog
      DB_PASSWORD: backlog
    ports:
      - "8083:8083"

  schedule-service:
    <<: *app-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: schedule-service
    environment:
      <<: *app-env
      PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/schedule
      DB_USER: schedule
      DB_PASSWORD: schedule
      PLANNING_SERVICE_URI: http://planning-service:8085
    ports:
      - "8084:8084"

  planning-service:
    <<: *app-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: planning-service
    environment:
      <<: *app-env
      PORT: "8085"
      DB_URL: jdbc:postgresql://postgres:5432/planning
      DB_USER: planning
      DB_PASSWORD: planning
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      PORT: "8080"
      REDIS_HOST: redis
      TEAM_SERVICE_URI: http://team-service:8082
      BACKLOG_SERVICE_URI: http://backlog-service:8083
      SCHEDULE_SERVICE_URI: http://schedule-service:8084
      PLANNING_SERVICE_URI: http://planning-service:8085
      TIMELINE_BFF_URI: http://timeline-bff:8081
      OIDC_ISSUER: http://localhost:8090/realms/timeline
      OIDC_JWKS: http://keycloak:8090/realms/timeline/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  timeline-bff:
    <<: *app-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: timeline-bff
    environment:
      <<: *app-env
      PORT: "8081"
      MONGODB_URI: mongodb://mongodb:27017/timeline
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
