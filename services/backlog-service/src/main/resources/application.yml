spring:
  application:
    name: backlog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backlog}
    username: ${DB_USER:backlog}
    password: ${DB_PASSWORD:backlog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # Вторая локация — общие таблицы outbox и processed_event из libs/common-outbox.
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8090/realms/timeline}
          # Издатель токена виден клиенту снаружи, а ключи сервис забирает по
          # внутреннему адресу: иначе проверка подписи не работала бы в docker-сети.
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8090/realms/timeline/protocol/openid-connect/certs}

server:
  port: ${PORT:8083}

timeline:
  outbox:
    poll-interval: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: backlog-service

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
