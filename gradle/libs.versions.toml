[versions]
# Проверенная пара: BOM Spring Cloud 2025.0.3 собран поверх Spring Boot 3.5.15.
springBoot = "3.5.16"
springCloud = "2025.0.3"
dependencyManagement = "1.1.7"
springdoc = "2.8.13"
testcontainers = "1.20.6"

[libraries]
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
